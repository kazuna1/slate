name: Release

# Push a tag like v1.0.0 to build Slate on clean Windows and macOS machines and publish
# SlateSetup.exe, the portable Windows zip and Slate-macOS.zip as one GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Optional repo secrets; the matching publish step is skipped when one is missing.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe, zip and installer
        shell: pwsh
        run: ./windows/tools/publish.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slate
          path: |
            windows/publish/SlateSetup.exe
            windows/publish/Slate-*-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem windows/publish -Filter 'Slate-*-win-x64.zip').FullName
          gh release create $env:GITHUB_REF_NAME windows/publish/SlateSetup.exe $zip `
            --title "Slate $env:GITHUB_REF_NAME" `
            --notes-file .github/release-notes.md

      # npm: `npm i -g kazuna-slate`. Package version follows the tag.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        working-directory: windows/npm
        shell: pwsh
        run: |
          npm version $env:GITHUB_REF_NAME.TrimStart('v') --no-git-tag-version --allow-same-version
          "//registry.npmjs.org/:_authToken=$env:NPM_TOKEN" | Out-File .npmrc -Encoding ascii
          npm publish --access public

      # winget: opens the version-bump PR on microsoft/winget-pkgs.
      # Only works once the first submission (kazuna1.Slate 1.0.0) has been merged.
      - name: Update winget manifest
        if: startsWith(github.ref, 'refs/tags/') && env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update kazuna1.Slate `
            --version $env:GITHUB_REF_NAME.TrimStart('v') `
            --urls "https://github.com/kazuna1/slate/releases/download/$env:GITHUB_REF_NAME/SlateSetup.exe" `
            --submit --token $env:WINGET_TOKEN

  # macOS: universal Slate.app, added to the release the Windows job created.
  mac:
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      # A fixed self-signed certificate (secrets MAC_SIGN_P12 + MAC_SIGN_PASSWORD) keeps Slate's identity the
      # same across versions, so macOS remembers permissions. Skipped (ad-hoc signing) if the secrets are missing.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MAC_SIGN_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing secrets: ad-hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/slate.keychain-db"
          PASS=$(printf %s "$PASSWORD" | tr -d '\r\n')
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/slate.p12"
          security create-keychain -p ci "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/slate.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          # codesign only looks in keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          rm "$RUNNER_TEMP/slate.p12"
          echo "SLATE_SIGN_IDENTITY=Slate Code Signing" >> "$GITHUB_ENV"
          echo "SLATE_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build Slate.app
        run: ./mac/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos
          path: mac/publish/Slate-macOS.zip

      - name: Add to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mac/publish/Slate-macOS.zip --clobber
