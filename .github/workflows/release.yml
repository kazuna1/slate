name: Release

# Push a tag like v1.0.0 to build Slate on a clean Windows machine and publish
# SlateSetup.exe + the portable zip as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe, zip and installer
        shell: pwsh
        run: ./tools/publish.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slate
          path: |
            publish/SlateSetup.exe
            publish/Slate-*-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem publish -Filter 'Slate-*-win-x64.zip').FullName
          gh release create $env:GITHUB_REF_NAME publish/SlateSetup.exe $zip `
            --title "Slate $env:GITHUB_REF_NAME" `
            --notes-file .github/release-notes.md
